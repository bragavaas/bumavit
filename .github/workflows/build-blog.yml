name: Build Blog

on:
  push:
    branches:
      - main
    paths:
      - 'posts/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build blog HTML
        run: node scripts/build-blog.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml
          git add images/posts/ 2>/dev/null || true
          git add feed.xml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nenhum arquivo gerado mudou — nada a commitar."
          else
            git commit -m "chore: rebuild blog HTML [skip ci]

Co-Authored-By: Paperclip <noreply@paperclip.ing>"
            git push origin main
          fi
