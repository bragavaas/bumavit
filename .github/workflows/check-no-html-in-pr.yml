name: No generated HTML in PRs

on:
  pull_request:
    paths:
      - 'blog/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if generated blog HTML is in PR branch
        run: |
          HTML_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^blog/.*\.html$' || true)
          if [ -n "$HTML_FILES" ]; then
            echo "❌ BLOCKED: PR contains generated HTML files:"
            echo "$HTML_FILES"
            echo ""
            echo "Blog HTML should only be generated by the 'Build Blog' GitHub Action"
            echo "after merging the markdown source to main."
            echo ""
            echo "PRs must contain only markdown in posts/ — never pre-built HTML in blog/."
            echo "This prevents draft content from being indexed by Google on github.com before"
            echo "it is live on bumavit.com.br (see BUMA-53)."
            exit 1
          fi
          echo "✅ No generated HTML in PR — OK."
